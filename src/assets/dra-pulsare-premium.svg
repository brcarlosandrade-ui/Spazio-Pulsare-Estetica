<svg width="1200" height="1400" viewBox="0 0 1200 1400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="1400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5E9DF"/>
      <stop offset="1" stop-color="#D9B77A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7E7B2"/>
      <stop offset="0.25" stop-color="#DDB25F"/>
      <stop offset="0.5" stop-color="#B88039"/>
      <stop offset="0.75" stop-color="#F1D48A"/>
      <stop offset="1" stop-color="#C8943E"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1200" height="1400" fill="url(#bg)"/>
  <rect x="62" y="68" width="1076" height="1264" rx="54" fill="#101215" fill-opacity="0.08" stroke="url(#gold)" stroke-width="10"/>
  <rect x="112" y="118" width="976" height="1164" rx="30" fill="#F4F3F4" fill-opacity="0.18"/>

  <g opacity="0.88">
    <image href="./hero-clinic.jpg" x="145" y="164" width="910" height="1072" preserveAspectRatio="xMidYMid slice"/>
  </g>

  <rect x="290" y="1100" width="620" height="136" rx="26" fill="#101215" fill-opacity="0.75" stroke="url(#gold)" stroke-width="4"/>
  <text x="600" y="1178" text-anchor="middle" fill="#F8EBC8" font-size="64" font-family="Georgia, 'Times New Roman', serif" letter-spacing="1.5">Dra. Jéssica Oliveira</text>
  <text x="600" y="1218" text-anchor="middle" fill="#D7B778" font-size="26" font-family="Arial, sans-serif" letter-spacing="7">BIOMÉDICA ESTETA</text>

  <g filter="url(#soft)" opacity="0.7">
    <circle cx="247" cy="230" r="54" fill="#D4A863"/>
    <circle cx="953" cy="230" r="54" fill="#D4A863"/>
  </g>
