<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">Seven Beauties Estética Integrativa</title>
  <desc id="desc">Logotipo em vetor com estrela rosa, silhueta feminina e identificação da clínica.</desc>

  <defs>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d84a8a"/>
      <stop offset="100%" stop-color="#f08bb8"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-opacity=".18"/>
    </filter>
  </defs>

  <!-- Estrela externa -->
  <path d="M235 45 L310 205 L485 205 L348 302 L400 480 L235 380 L70 480 L122 302 L-15 205 L160 205 Z"
        fill="url(#pink)" filter="url(#shadow)"/>

  <!-- Estrela interna -->
  <path d="M235 112 L280 232 L405 232 L307 301 L344 420 L235 350 L126 420 L163 301 L65 232 L190 232 Z"
        fill="#24262d"/>

  <!-- Área interna clara -->
  <path d="M235 137 L266 247 L378 247 L291 307 L322 396 L235 340 L148 396 L179 307 L92 247 L204 247 Z"
        fill="#fafafa"/>

  <!-- Silhueta feminina estilizada -->
  <path d="M229 162
           C214 174 207 190 210 204
           C213 218 222 227 226 237
           C229 246 222 253 211 260
           C202 266 199 276 202 286
           C205 297 216 306 223 315
           C231 325 232 337 227 348
           C222 360 216 372 218 384
           C220 397 229 407 239 412
           C235 397 238 382 245 369
           C252 356 260 345 258 332
           C256 319 246 309 243 298
           C240 287 244 276 253 268
           C263 258 269 246 265 235
           C261 224 251 218 246 207
           C241 197 243 184 251 172
           C242 174 235 177 229 162 Z"
        fill="#d84a8a"/>

  <!-- Texto principal -->
  <text x="455" y="275"
        font-family="Brush Script MT, Segoe Script, cursive"
        font-size="105" font-style="italic"
        fill="#252831">Seven Beauties</text>

  <!-- Subtítulo -->
  <text x="470" y="350"
        font-family="Georgia, Times New Roman, serif"
        font-size="55" letter-spacing="1"
        fill="#b83d72">Estética Integrativa</text>

  <!-- Credenciais -->
  <text x="480" y="415"
        font-family="Arial, Helvetica, sans-serif"
        font-size="30" fill="#252831">Dra. Rosimeri Celestino Ribeiro</text>
  <text x="610" y="460"
        font-family="Arial, Helvetica, sans-serif"
        font-size="28" fill="#252831">Fisioterapeuta</text>
  <text x="585" y="505"
        font-family="Arial, Helvetica, sans-serif"
        font-size="25" fill="#252831">Crefito 8/75223-F</text>
</svg>